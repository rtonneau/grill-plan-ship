name: test

on:
  push:
  pull_request:

jobs:
  skill-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every SKILL.md is at most 200 lines
        run: node tests/check-skill-size.js --max 200

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        shell: bash
        run: for f in skills/gps/scripts/*.js skills/gps/scripts/lib/*.js tests/*.js tests/lib/*.js; do node --check "$f"; done
      - name: Tests
        run: npm test
